<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>定時退ピング UI サンプル</title>
    <style>
      :root {
        --bg-dark: #0f1117;
        --panel-bg: rgba(17, 22, 32, 0.54);
        --panel-line: rgba(255, 255, 255, 0.14);
        --text-main: #f7efe3;
        --text-sub: rgba(247, 239, 227, 0.82);
        --accent-warm: #ff8a3d;
        --accent-pink: #ff4fa0;
        --accent-cyan: #4fd8d1;
        --shadow-strong: 0 24px 60px rgba(0, 0, 0, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
        color: var(--text-main);
        background: var(--bg-dark);
      }

      body {
        min-height: 100vh;
        overflow: hidden;
      }

      .game-root {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        isolation: isolate;

90 130-110 220-92' fill='none' stroke='%234fd8d1' stroke-width='10' stroke-linecap='round' opacity='0.82'/%3E%3Crect x='760' y='515' width='92' height='32' rx='8' fill='%234fd8d1'/%3E%3Crect x='770' y='525' width='12' height='12' fill='%23212b38'/%3E%3Crect x='788' y='525' width='12' height='12' fill='%23212b38'/%3E%3Crect x='806' y='525' width='12' height='12' fill='%23212b38'/%3E%3Crect x='824' y='525' width='12' height='12' fill='%23212b38'/%3E%3Crect x='782' y='542' width='12' height='12' fill='%23212b38'/%3E%3Crect x='800' y='542' width='12' height='12' fill='%23212b38'/%3E%3Crect x='818' y='542' width='12' height='12' fill='%23212b38'/%3E%3Crect x='836' y='542' width='12' height='12' fill='%23212b38'/%3E%3Ccircle cx='560' cy='220' r='6' fill='%23ffd76a'/%3E%3Ccircle cx='1190' cy='230' r='6' fill='%23ff78bb'/%3E%3Ccircle cx='1240' cy='250' r='4' fill='%234fd8d1'/%3E%3Ccircle cx='305' cy='230' r='5' fill='%234fd8d1'/%3E%3C/svg%3E");
        background-size: cover;
        background-position: center;
      }

      .game-root::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at top, rgba(255, 174, 77, 0.1), transparent 34%),
          radial-gradient(circle at bottom right, rgba(79, 216, 209, 0.12), transparent 28%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.34));
        z-index: -1;
      }

      .ui-layer {
        width: min(720px, 100%);
        padding: clamp(28px, 5vw, 54px);
        border: 1px solid var(--panel-line);
        border-radius: 32px;
        background: var(--panel-bg);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow-strong);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 12px;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.72);
      }

      .title {
        margin: 0;
        font-size: clamp(3rem, 8vw, 5.8rem);
        line-height: 0.96;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      .title-accent {
        background: linear-gradient(135deg, var(--accent-warm), #ffd56c);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .subcopy {
        width: min(520px, 100%);
        margin: 18px auto 0;
        font-size: clamp(1rem, 2vw, 1.18rem);
        line-height: 1.8;
        color: var(--text-sub);
      }

      .button-stack {
        display: grid;
        gap: 14px;
        width: min(340px, 100%);
        margin: 34px auto 0;
      }

      .menu-button {
        border: 0;
        border-radius: 999px;
        min-height: 62px;
        padding: 0 28px;
        font: inherit;
        font-size: 1.08rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        color: white;
        cursor: pointer;
        box-shadow:
          0 14px 28px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.24);
        transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
      }

      .menu-button:hover {
        transform: translateY(-2px) scale(1.01);
        filter: brightness(1.05);
        box-shadow:
          0 18px 34px rgba(0, 0, 0, 0.34),
          inset 0 1px 0 rgba(255, 255, 255, 0.24);
      }

      .menu-button:active {
        transform: translateY(1px);
      }

      .menu-button.start {
        background: linear-gradient(135deg, #ff8a3d, #ff4d6d);
      }

      .menu-button.howto {
        background: linear-gradient(135deg, #5b8cff, #4fd8d1);
      }

      .menu-button.ranking {
        background: linear-gradient(135deg, #8d58ff, #ff4fa0);
      }

      .status-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 26px;
      }

      .status-chip {
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 0.88rem;
        color: rgba(255, 255, 255, 0.8);
      }

      .dialog {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(3, 5, 10, 0.72);
      }

      .dialog.open {
        display: flex;
      }

      .dialog-card {
        width: min(520px, 100%);
        padding: 28px;
        border-radius: 24px;
        background: rgba(14, 18, 27, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: var(--shadow-strong);
      }

      .dialog-title {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }

      .dialog-text {
        margin: 0;
        line-height: 1.8;
        color: rgba(255, 255, 255, 0.8);
      }

      .dialog-close {
        margin-top: 20px;
      }

      @media (max-width: 720px) {
        .game-root {
          padding: 16px;
          background-position: 58% center;
        }

        .ui-layer {
          border-radius: 24px;
          padding: 24px 18px;
        }

        .button-stack {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-root">
      <main class="ui-layer">
        <p class="eyebrow">Browser Typing Game</p>
        <h1 class="title">定時<span class="title-accent">退</span>ピング</h1>
        <p class="subcopy">
          背景イラストの上に半透明の UI を重ねた、HTML + CSS + JavaScript のタイトル画面サンプルです。
        </p>

        <div class="button-stack">
          <button class="menu-button start" id="start-button" type="button">スタート</button>
          <button class="menu-button howto" id="howto-button" type="button">遊び方</button>
          <button class="menu-button ranking" id="ranking-button" type="button">ランキング</button>
        </div>

        <div class="status-row">
          <span class="status-chip">背景画像 + UI レイヤー</span>
          <span class="status-chip">HTML / CSS / JavaScript</span>
          <span class="status-chip">Canvas 不使用</span>
        </div>
      </main>
    </div>

    <div class="dialog" id="dialog">
      <div class="dialog-card">
        <h2 class="dialog-title" id="dialog-title">タイトル</h2>
        <p class="dialog-text" id="dialog-text"></p>
        <button class="menu-button start dialog-close" id="close-dialog" type="button">閉じる</button>
      </div>
    </div>

    <script>
      const dialog = document.getElementById("dialog");
      const dialogTitle = document.getElementById("dialog-title");
      const dialogText = document.getElementById("dialog-text");
      const closeDialog = document.getElementById("close-dialog");

      function openDialog(title, text) {
        dialogTitle.textContent = title;
        dialogText.textContent = text;
        dialog.classList.add("open");
      }

      document.getElementById("start-button").addEventListener("click", () => {
        openDialog("スタート", "ここから難易度選択やゲーム本編へ遷移させます。");
      });

      document.getElementById("howto-button").addEventListener("click", () => {
        openDialog("遊び方", "表示された日本語をローマ字で入力し、定時前の退勤を目指します。");
      });

      document.getElementById("ranking-button").addEventListener("click", () => {
        openDialog("ランキング", "ランキング画面や自己ベスト一覧へ接続する想定です。");
      });

      closeDialog.addEventListener("click", () => {
        dialog.classList.remove("open");
      });

      dialog.addEventListener("click", (event) => {
        if (event.target === dialog) {
          dialog.classList.remove("open");
        }
      });
    </script>
  </body>
</html>
